name: Update Antigravity Unlocker cask

on:
  schedule:
    - cron: "53 4 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-antigravity-unlocker-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check official macOS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ruby scripts/update-antigravity-unlocker-cask.rb
      - name: Commit updated cask
        run: |
          if git diff --quiet -- Casks/antigravity-unlocker.rb; then
            echo "Antigravity Unlocker cask is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/antigravity-unlocker.rb
          git commit -m "casks: update Antigravity Unlocker"
          git pull --rebase origin main
          git push origin HEAD:main
