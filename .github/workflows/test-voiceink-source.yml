name: Test VoiceInk source cask

on:
  push:
    paths:
      - "Casks/voiceink-source.rb"
      - "scripts/**"
      - ".github/workflows/test-voiceink-source.yml"
  pull_request:
    paths:
      - "Casks/voiceink-source.rb"
      - "scripts/**"
      - ".github/workflows/test-voiceink-source.yml"
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voiceink-source-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out tap
        uses: actions/checkout@v5

      - name: Check Ruby syntax
        run: |
          ruby -c Casks/voiceink-source.rb
          ruby -c scripts/update-voiceink-cask.rb

      - name: Build and install cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: >-
          brew install --cask --verbose
          "$GITHUB_WORKSPACE/Casks/voiceink-source.rb"

      - name: Inspect installed app without launching it
        run: |
          app="$HOME/Applications/VoiceInk-local.app"
          test -d "$app"
          test -f "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "com.prakashjoshipax.VoiceInk"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app"
