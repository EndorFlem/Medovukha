name: Update casks

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tap
        uses: actions/checkout@v5

      - name: Update managed casks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ruby scripts/update-voiceink-cask.rb
          ruby scripts/update-odysseus-cask.rb
          ruby scripts/update-veilio-cask.rb

      - name: Commit and push changes
        run: |
          if git diff --quiet -- Casks/voiceink-source.rb Casks/odysseus-source.rb Casks/veilio.rb; then
            echo "Managed casks are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/voiceink-source.rb Casks/odysseus-source.rb Casks/veilio.rb
          git commit -m "casks: update managed applications"
          git push
