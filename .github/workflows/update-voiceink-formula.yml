name: Update VoiceInk source formula

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-voiceink-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out tap
        uses: actions/checkout@v5

      - name: Update formula metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ruby scripts/update-voiceink-formula.rb

      - name: Commit and push formula update
        run: |
          if git diff --quiet -- Formula/voiceink-source.rb; then
            echo "No formula update needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/voiceink-source.rb
          git commit -m "voiceink-source: update upstream revision"
          git push
