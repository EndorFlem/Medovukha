name: Update Aseprite source cask

on:
  schedule:
    - cron: "47 3 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-aseprite-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check upstream source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ruby scripts/update-aseprite-cask.rb
      - name: Commit updated cask
        run: |
          if git diff --quiet -- Casks/aseprite-source.rb; then
            echo "Aseprite source cask is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/aseprite-source.rb
          git commit -m "casks: update Aseprite source"
          git pull --rebase origin main
          git push origin HEAD:main
