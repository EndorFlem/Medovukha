name: Update Telegram MCP formula

on:
  schedule:
    - cron: "47 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-telegram-mcp
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tap
        uses: actions/checkout@v5

      - name: Update Telegram MCP formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: ruby scripts/update-telegram-mcp-formula.rb

      - name: Commit and push changes
        run: |
          if git diff --quiet -- Formula/telegram-mcp-source.rb; then
            echo "Telegram MCP formula is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/telegram-mcp-source.rb
          git commit -m "telegram-mcp: update source formula"
          git push
