name: Update Hiddify cask

on:
  schedule:
    - cron: "23 4 * * 4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-hiddify-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check official Hiddify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ruby scripts/update-hiddify-cask.rb
      - name: Commit updated cask
        run: |
          if git diff --quiet -- Casks/hiddify.rb; then
            echo "Hiddify cask is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/hiddify.rb
          git commit -m "casks: update Hiddify"
          git pull --rebase origin main
          git push origin HEAD:main
